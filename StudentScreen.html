<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Portal — AI-Based Smart Evaluation System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="shared_style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">e</span>
      <span>evalvate<span class="brand-dot">.</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="ViewMarks.html">View Marks</a>
      <a href="StudentScreen.html" class="active">Student Dashboard</a>
      <a href="DemoDetails.html">Demo Details</a>
    </nav>
    <div class="nav-actions">
      <button class="button button-demo" onclick="openDemoDetailsModal()">⚡ Demo Details</button>
      <a class="button button-outline" href="index.html">Logout</a>
    </div>
  </header>

  <div class="portal-wrapper">
    <div class="portal-header">
      <div>
        <h2>Welcome, <span id="student-name">Meghana</span>!</h2>
        <p style="color:#667060; font-size:14px; margin-top:2px;">Logged in as Student</p>
      </div>
      <div class="portal-nav">
        <a href="student_dashboard.html" style="background:#eef2ff; color:#4f46e5; font-weight:700; border:1px solid #c7d2fe; border-radius:6px; padding:6px 12px;">🚀 Study Life Hub & Dashboard</a>
        <a href="ViewMarks.html">Lookup Any Roll Number</a>
        <a href="StudentScreen.html" class="active">My Evaluation Report</a>
        <a href="index.html" style="color:#cf222e;">Logout</a>
      </div>
    </div>

    <!-- REPORT CARD -->
    <div class="portal-card" style="max-width:920px; margin:auto;">
      <div id="student-profile-report"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div><b>evalvate.</b> AI-Based Smart Evaluation System</div>
    <div>Project by G. Meghana · BVRIT</div>
  </footer>

  <script src="shared_app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const u = JSON.parse(localStorage.getItem('evalvate_current_user') || '{"username":"Meghana"}');
      document.getElementById('student-name').innerText = u.username;

      const db = getDB();
      const myEval = db.evaluations.find(e => e.rollNumber === '2026CS101') || db.evaluations[0];

      let html = `
        <div style="background:#f4f8f0; border:1px solid #d5e8ca; border-radius:12px; padding:22px 26px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:12px; color:#5c783e; font-weight:bold; text-transform:uppercase;">Official Evaluation Result</div>
            <h3 style="margin:6px 0 2px; font-size:24px; color:#21291e;">${myEval.studentName}</h3>
            <div style="color:#626f5b; font-size:13px;">Roll Number: <b>${myEval.rollNumber}</b> · Subject: <b>Computer Science & Science</b></div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11px; color:#627259; font-weight:700;">TOTAL OBTAINED</div>
            <div style="font-size:32px; font-weight:800; color:#2e7d32;">${myEval.totalAwarded.toFixed(2)} <span style="font-size:16px; color:#777;">/ ${myEval.totalMax}</span></div>
          </div>
        </div>

        <table class="eval-table">
          <thead>
            <tr>
              <th style="width:30%;">Question</th>
              <th>Your Submitted Response</th>
              <th style="text-align:center;">Max Marks</th>
              <th style="text-align:center;">Awarded Score</th>
            </tr>
          </thead>
          <tbody>
      `;

      myEval.records.forEach(r => {
        html += `
          <tr>
            <td style="font-weight:600;">${r.question}</td>
            <td style="color:#555; font-style:italic;">${r.studentAnswer}</td>
            <td style="text-align:center;">${r.maxMarks}</td>
            <td style="text-align:center;"><b style="color:#2e7d32; font-size:16px;">${r.awardedMarks}</b></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById('student-profile-report').innerHTML = html;
    });
  </script>
</body>
</html>
